[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag-pgvector"
version = "0.1.0"
description = "Local offline-capable RAG with FastAPI, PostgreSQL, pgvector, hybrid search, and local Hugging Face models."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "python-dotenv>=1.0",
  "beautifulsoup4>=4.12",
  "pypdf>=4.2",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]
local-llm = [
  "huggingface-hub>=0.24",
  "sentence-transformers>=3.0",
  "llama-cpp-python>=0.2.90",
  "transformers>=4.43",
  "accelerate>=0.33",
  "torch>=2.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
